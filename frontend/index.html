<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OmniShop — E-Commerce Microservices</title>
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    // OmniShop design tokens — single source of truth for brand styling.
    // Components reference these tokens (bg-brand-600, text-brand-700, ...),
    // never hardcoded hex values.
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef4ff', 100: '#dbe7fe', 200: '#bfd3fe', 300: '#93b4fd',
              400: '#608dfa', 500: '#3b67f6', 600: '#2549eb', 700: '#1d3ad8',
              800: '#1e32af', 900: '#1e2f8a',
            },
            accent: { 500: '#16a34a', 600: '#15803d' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          },
          boxShadow: {
            lift: '0 10px 25px -5px rgb(37 73 235 / 0.18), 0 8px 10px -6px rgb(37 73 235 / 0.1)',
          },
        },
      },
    }
  </script>
  <style>
    :root {
      --brand-600: #2549eb;
      --brand-700: #1d3ad8;
      --ease-micro: cubic-bezier(0.4, 0, 0.2, 1);
    }
    body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }
    @keyframes drawer-in {
      from { opacity: 0; transform: translateX(16px); }
      to { opacity: 1; transform: translateX(0); }
    }
    .animate-drawer-in { animation: drawer-in 200ms var(--ease-micro); }
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-up { animation: fade-up 200ms var(--ease-micro); }
    @keyframes pop-in {
      0% { opacity: 0; transform: scale(0.6); }
      70% { transform: scale(1.05); }
      100% { opacity: 1; transform: scale(1); }
    }
    .animate-pop { animation: pop-in 350ms var(--ease-micro); }
    .check-draw path {
      stroke-dasharray: 24;
      stroke-dashoffset: 24;
      animation: draw-check 400ms ease-out 150ms forwards;
    }
    @keyframes draw-check { to { stroke-dashoffset: 0; } }
    .transition-micro { transition: all 150ms var(--ease-micro); }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

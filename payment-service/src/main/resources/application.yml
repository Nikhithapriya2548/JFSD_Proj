server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:omnishop_payments}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672

# Mock gateway tuning (demo only — see PaymentService javadoc)
payment:
  simulated-delay-ms: ${PAYMENT_DELAY_MS:1500}
  success-rate: ${PAYMENT_SUCCESS_RATE:0.85}

jwt:
  secret: ${JWT_SECRET:omnishop-dev-secret-key-min-32-chars-long!!}

management:
  zipkin:
    tracing:
      endpoint: http://zipkin:9411/api/v2/spans
  tracing:
    sampling:
      probability: 1.0
